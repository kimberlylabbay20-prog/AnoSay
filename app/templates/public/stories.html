<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories | AnoSay</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/public-stories.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="topbar-logo" href="/ui/">
                <span class="logo-ano">Ano</span><span class="logo-say">Say</span>
            </a>
            <nav class="topbar-nav">
                <a class="topbar-link" href="/ui/">Home</a>
                <a class="topbar-link active" href="/ui/stories">Stories</a>
                <a class="topbar-link" href="/ui/submit">Share</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <section class="controls">
            <div class="controls-inner">
                <div class="search-group">
                    <input class="search-input" id="search-input" type="text" placeholder="Search stories…">
                    <button class="btn btn-search" id="search-btn">Search</button>
                </div>
                <div class="filter-group">
                    <select class="filter-select" id="category-select">
                        <option value="">All categories</option>
                    </select>
                    <button class="btn btn-latest" id="latest-btn">Latest</button>
                </div>
            </div>
        </section>

        <section class="stories">
            <div class="stories-inner">
                <p id="stories-status" class="status-note"></p>
                <div class="story-grid" id="story-grid"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>AnoSay &copy; 2026 &mdash; Anonymous campus sharing.</p>
    </footer>

    <script src="{{ url_for('static', path='/js/public-stories.js') }}"></script>
</body>
</html>
