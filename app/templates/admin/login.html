<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AnoSay</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/admin-login.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-ano">Ano</span><span class="logo-say">Say</span>
        </div>
    </header>

    <main class="login-page">
        <div class="login-card">
            <h1 class="login-title">Admin Login</h1>
            <p class="login-subtitle">Sign in to manage stories, reports, and categories.</p>

            <form class="login-form" method="post" action="#" id="login-form">
                <label class="field-label" for="username">Username</label>
                <input class="text-input" type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">

                <label class="field-label" for="password">Password</label>
                <input class="text-input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">

                <button class="login-button" type="submit">Login</button>
            </form>

            <div class="error-message" id="login-error" role="alert"></div>
        </div>
    </main>
    <script src="{{ url_for('static', path='/js/admin-login.js') }}"></script>
</body>
</html>
