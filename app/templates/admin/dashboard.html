<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AnoSay</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/admin-dashboard.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-ano">Ano</span><span class="logo-say">Say</span>
        </div>
        <div class="admin-profile">
            <div class="avatar">A</div>
            <span class="admin-name">Admin</span>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <button class="hamburger" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav">
                <a class="nav-item active" href="/ui/admin/dashboard">Dashboard</a>
                <a class="nav-item" href="/ui/admin/stories">Stories</a>
                <a class="nav-item" href="/ui/admin/reports">Reports</a>
                <a class="nav-item" href="/ui/admin/categories">Categories</a>
            </nav>
        </aside>

        <main class="content">
            <h1 class="page-title">Dashboard</h1>
            <p id="dashboard-status" class="status-note"></p>
            <div class="stats-row">
                <div class="stat">
                    <div class="circle">
                        <span class="circle-value" data-count="pending">0</span>
                    </div>
                    <span class="circle-label">Pending Stories</span>
                </div>
                <div class="connector"></div>
                <div class="stat">
                    <div class="circle">
                        <span class="circle-value" data-count="approved">0</span>
                    </div>
                    <span class="circle-label">Approved Stories</span>
                </div>
                <div class="connector"></div>
                <div class="stat">
                    <div class="circle">
                        <span class="circle-value" data-count="reports">0</span>
                    </div>
                    <span class="circle-label">Reports</span>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', path='/js/admin-dashboard.js') }}"></script>
    <script src="{{ url_for('static', path='/js/admin-logout.js') }}"></script>
</body>
</html>
